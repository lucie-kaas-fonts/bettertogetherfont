<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @font-face {
            font-family: 'BetterTogether-Condensed';
            src: url('https://lucie-kaas-fonts.github.io/bettertogetherfont/fonts/BetterTogether-Condensed.woff2') format('woff2'),
                 url('https://lucie-kaas-fonts.github.io/bettertogetherfont/fonts/BetterTogether-Condensed.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'BetterTogether-Script';
            src: url('https://lucie-kaas-fonts.github.io/bettertogetherfont/fonts/BetterTogether-Script.woff2') format('woff2'),
                 url('https://lucie-kaas-fonts.github.io/bettertogetherfont/fonts/BetterTogether-Script.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        h1, h2, h3 {
            font-family: 'BetterTogether-Condensed', sans-serif;
            margin: 20px 0 10px 0;
        }

        .script-text {
            font-family: 'BetterTogether-Script', cursive;
            font-size: 24px;
            color: #666;
            margin: 15px 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .button {
            display: inline-block;
            background-color: #667eea;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Better Together!</h1>
        
        <p class="script-text">Something special awaits you</p>
        
        <p>Hi there,</p>
        
        <p>Thank you for joining us. We're excited to have you as part of our community.</p>
        
        <h2>What's Next?</h2>
        <p>Explore our latest offerings and discover what makes us special.</p>
        
        <a href="#" class="button">Get Started</a>
        
        <p style="margin-top: 40px; font-size: 12px; color: #999;">
            Best regards,<br>
            The Better Together Team
        </p>
    </div>
</body>
</html>
